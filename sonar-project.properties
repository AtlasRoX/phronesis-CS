# SonarCloud project configuration
sonar.projectKey=AtlasRoX_phronesis-CS
sonar.organization=atlasrox

# Project metadata
sonar.projectName=Phronesis
# projectVersion is passed by the workflow from pyproject.toml (sonar.projectVersion).
sonar.projectDescription=AI Agents for drug discovery, drug development, and other pharmaceutical R&D.

# Source code configuration
sonar.sources=phronesis
sonar.tests=tests,phronesis
sonar.test.inclusions=tests/**/test_*.py,phronesis/**/tests/**/test_*.py
sonar.exclusions=**/tests/**,docs/**,app/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/*.egg-info/**,**/.DS_Store,**/.env,**/.coverage,**/docker-compose/**,**/README.md,**/install.md,**/Dockerfile,**/entrypoint.sh,**/build/**,**/dist/**

# Python specific settings
sonar.python.version=3.12

# Coverage settings
sonar.python.coverage.reportPaths=coverage-core.xml,coverage-phronesis.xml,coverage-vivarix.xml,coverage-lumicell.xml,coverage-synapta.xml,coverage-lithoscribe.xml

# External reports
sonar.python.pylint.reportPaths=pylint-phronesis.json,pylint-vivarix.json,pylint-lumicell.json,pylint-synapta.json,pylint-lithoscribe.json
sonar.python.bandit.reportPaths=bandit-phronesis.json,bandit-vivarix.json,bandit-lumicell.json,bandit-synapta.json,bandit-lithoscribe.json

# Code analysis settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Quality gate settings
sonar.qualitygate.wait=true

# Duplication detection
sonar.cpd.python.minimumTokens=50
sonar.cpd.exclusions=**/__init__.py,**/states/**,**/configs/**

# Additional exclusions for generated or vendor code
sonar.coverage.exclusions=**/tests/**,docs/**,app/**
