[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phronesis"
description = "AI Agents for drug discovery, drug development, and other pharmaceutical R&D."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "anndata==0.12.2",
  "cell2sentence==1.2.0",
  "copasi_basico==0.88",
  "einops==0.8.2",
  "fastapi==0.143.2",
  "uvicorn==0.54.0",
  "gdown==5.2.0",
  "gravis==0.1.0",
  "gseapy==1.3.1",
  "h5py==3.16.0",
  "httpx==0.28.1",
  "huggingface_hub==0.34.4",
  "hydra-core==1.3.7",
  "igraph==0.11.9",
  "joblib==1.6.0",
  "langchain==0.3.7",
  "langchain-community==0.3.5",
  "langchain-core==0.3.40",
  "langchain-experimental==0.3.4",
  "langchain-milvus==0.2.1",
  "langchain-nvidia-ai-endpoints==0.3.9",
  "langchain-openai==0.3.0",
  "langchain_ollama==0.2.3",
  "langgraph==0.3.34",
  "langgraph_supervisor==0.0.9",
  "matplotlib==3.11.2",
  "nbformat==5.11.1",
  "numpy==1.26.4",
  "ollama==0.6.3",
  "openai==1.59.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pcst_fast==1.0.10",
  "plotly==6.3.0",
  "plotly-express==0.4.1",
  "pubchempy==1.0.5",
  "pydantic==2.14.1",
  "PyJWT==2.10.1",
  "pygeneconverter==0.3",
  "pymilvus==2.6.2",
  "pypdf==6.20.1",
  "pyzotero==1.16.0",
  "requests==2.34.2",
  "scanpy==1.11.4",
  "scipy==1.16.2",
  "seaborn==0.13.2",
  "sentence_transformers==3.3.1",
  "streamlit==1.66.0",
  "streamlit-feedback==0.1.4",
  "tabulate==0.10.0",
  "torch==2.14.1",
  "torch_geometric==2.8.1",
  "tqdm==4.70.1",
  "transformers==4.55.2",
  "umap-learn==0.5.12",
  "xlsxwriter==3.2.9",
  "python-magic==0.4.27",
  "pyarrow==21.0.0",
  "datasets==4.1.1",
  "beautifulsoup4==4.15.0",
  "cloudscraper==1.2.71",
  "azure-identity==1.26.0",
  "duckduckgo-search==8.1.1",
  "python-multipart==0.0.32",
  "python-docx==1.2.0",
  "fpdf2==2.8.9",
  "markdown-it-py==4.2.0",
]
version = "1.49.1"

[project.scripts]
phronesis-eval = "phronesis.evals.cli:main"
phronesis-primekg = "phronesis.kgintel.cli:main"

[project.optional-dependencies]
dev = [
  "coverage==7.16.2",
  "ipykernel==6.30.1",
  "ipython==8.32.0",
  "pylint==3.3.8",
  "pytest==8.4.2",
  "pytest-asyncio==0.25.2",
  "setuptools==80.9.0",
  "ruff==0.17.1",
  "mypy==1.18.2",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "safety==3.8.1",
  "pre-commit==4.7.0",
  "twine==6.2.0",
  "python-semantic-release==10.7.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-include-markdown-plugin==7.3.0",
  "mkdocs-jupyter==0.26.3",
  "mkdocs-material==9.7.7",
  "mkdocstrings==0.30.1",
  "mkdocstrings-python==1.18.2",
]

[tool.semantic_release]
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
version_toml = [
  "pyproject.toml:project.version",
]
commit_parser = "conventional"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true


[tool.hatch.build.targets.wheel]
packages = ["phronesis"]
exclude = [
  "phronesis/synapta/tests/files",
  "phronesis/synapta/tests/files/**/*",
  "phronesis/**/tests/files/**/*",
  "dist/*",
  ".venv/*",
  "node_modules/*",
]


[tool.hatch.build.targets.sdist]
exclude = [
  "phronesis/synapta/tests/files",
  "phronesis/synapta/tests/files/**/*",
  "phronesis/**/tests/files/**/*",
  "dist/*",
  ".venv/*",
  "node_modules/*",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration tests",
  "unit_mock: marks tests that are fully mocked and avoid external resources",
  "network: calls live upstream APIs or the configured LLM; skipped unless PHRONESIS_LIVE_TESTS=1",
  "live: end-to-end against a running backend or real model; run only on demand",
  "slow: takes more than a few seconds offline; deselect with -m 'not slow'",
]

[tool.pylint.MASTER]
extension-pkg-allow-list = ["pcst_fast"]

[tool.pylint.messages_control]
disable = ["R0801", "R0902", "W0221", "W0122"]

[tool.pylint.format]
max-module-lines = 2000

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line length: enforced by review, not a gate (3.4k legacy violations)
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["setuptools.*", "pkg_resources.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = [
  "B101",
  "B601",
  "B404",
  "B607",
  "B403",
  "B301",
  "B615",
  "B603",
  "B405",
  "B314",
]
# B501 (verify=False), B602 (shell=True) and B614 (torch.load) are reported: mark an intentional call
# with an inline `# nosec <code>` and a reason instead of skipping the check repo-wide.

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

[tool.coverage.run]
source = ["phronesis"]
omit = ["*/tests/*", "*/test_*", "docs/*", "app/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "except URLError as e:",
]

[tool.coverage.xml]
output = "coverage.xml"
